name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run compile
      # lib/ is committed for Git installs; it must match the sources.
      - run: git diff --exit-code -- lib
      # The published package must load with plain Node and no dev dependencies.
      - run: node -e "import('./lib/index.js').then(m => { if (typeof m.apply !== 'function') process.exit(1) })"
