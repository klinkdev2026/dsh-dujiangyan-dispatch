<style>
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#06121a;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#e8f1f6}

</style></head><body>
<div id="ov"></div>
<script type="module">
import * as THREE from '../../node_modules/three/build/three.module.js'

const q = new URLSearchParams(location.search)
const lang = q.get('lang') || 'zh'
const T = 18
const W = 1280, H = 720

// ================= hydrology timeline =================
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x)
// 都江堰渠首工程泄洪流量表 (m³/s), from《四川都江堰灌区工程手册》(1993), as quoted by
// 王芳芳、吴时强《都江堰工程的思考与启示》(南京水利科学研究院). Weir flow includes the 平水槽 and 人字堤 overflow.
//            岷江   内江   外江  宝瓶口 飞沙堰
const TABLE = [[1000,  550,  450, 420,  130],
               [2000, 1020,  980, 520,  500],
               [4000, 1800, 2200, 640, 1160],
               [5500, 2300, 3200, 700, 1600]]
const Q0 = 1000, QPEAK = 5500 // 5500 ≈ the largest flood measured at 紫坪铺: 5480 m³/s on 1964-07-22
/** Min River discharge over the loop: a flood hydrograph 1000 -> 5500 -> 1000 */
const riverQ = t => t < 2 ? Q0 : t < 5.5 ? Q0 + (QPEAK - Q0) * smooth((t - 2) / 3.5) : t < 13 ? QPEAK : t < 16.5 ? QPEAK - (QPEAK - Q0) * smooth((t - 13) / 3.5) : Q0
/** split of a Min River discharge, linearly interpolated between the table rows */
function split(Q) {
  let i = 0; while (i < TABLE.length - 2 && Q > TABLE[i + 1][0]) i++
  const a = TABLE[i], b = TABLE[i + 1], k = Math.max(0, Math.min(1, (Q - a[0]) / (b[0] - a[0])))
  const v = a.map((x, j) => x + (b[j] - x) * k)
  return { Q: v[0], inner: v[1], outer: v[2], neck: v[3], weir: v[4] }
}
/** 0..1 flood factor, used only for colour (sediment load) */
const floodAt = t => (riverQ(t) - Q0) / (QPEAK - Q0)
const PH = { rise: [2, 4.5], fish: [4.5, 7.5], weir: [7.5, 10.5], neck: [10.5, 13.5], end: [13.5, 18] }

// ================= geometry (map units from the 2D draft; flow left -> right) =================
const cub = (a, b, c, d, t) => { const u = 1 - t; return [u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0], u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]] }
const toW = ([X, Y]) => [(X - 640) / 4, (Y - 330) / 4]
function sampleSegs(segs, step = 0.8) {
  const raw = []
  segs.forEach((s, i) => { for (let k = i ? 1 : 0; k <= 200; k++) raw.push(toW(cub(...s, k / 200))) })
  const out = [raw[0]]; let acc = 0
  for (let i = 1; i < raw.length; i++) { acc += Math.hypot(raw[i][0]-raw[i-1][0], raw[i][1]-raw[i-1][1]); if (acc >= step) { out.push(raw[i]); acc = 0 } }
  if (out.at(-1) !== raw.at(-1)) out.push(raw.at(-1))
  return out
}
const lineSeg = (a, b) => [[a, [a[0]+(b[0]-a[0])/3, a[1]+(b[1]-a[1])/3], [a[0]+2*(b[0]-a[0])/3, a[1]+2*(b[1]-a[1])/3], b]]
const INNER_BED = -1.2
const RIV = {
  main:  { segs: [[[-120, 352], [80, 350], [200, 352], [300, 354]]], bed: -0.6, hw: 13, bank: 7 },
  inner: { segs: [[[292, 352], [342, 330], [380, 262], [480, 254]], [[480, 254], [600, 242], [760, 246], [872, 238]]], bed: INNER_BED, hw: 5.5, bank: 4 },
  neck:  { segs: lineSeg([866, 238], [956, 230]), bed: 0.0, hw: 2.4, bank: 1.2 },
  outer: { segs: [[[292, 358], [350, 388], [420, 410], [520, 400]], [[520, 400], [620, 392], [740, 376], [860, 414]], [[860, 414], [980, 462], [1120, 540], [1400, 610]]], bed: -0.6, hw: 10, bank: 7 },
  c1: { segs: [[[950, 230], [1010, 222], [1080, 180], [1400, 110]]], bed: 0.4, hw: 1.1, bank: 1 },
  c2: { segs: [[[950, 231], [1020, 232], [1110, 214], [1400, 196]]], bed: 0.4, hw: 1.1, bank: 1 },
  c3: { segs: [[[950, 232], [1010, 246], [1120, 262], [1400, 270]]], bed: 0.4, hw: 1.1, bank: 1 },
  c4: { segs: [[[950, 234], [990, 270], [1060, 300], [1200, 340]]], bed: 0.4, hw: 1.0, bank: 1 },
}
for (const r of Object.values(RIV)) {
  r.pts = sampleSegs(r.segs)
  r.cum = [0]; for (let i = 1; i < r.pts.length; i++) r.cum.push(r.cum[i-1] + Math.hypot(r.pts[i][0]-r.pts[i-1][0], r.pts[i][1]-r.pts[i-1][1]))
  r.len = r.cum.at(-1)
}
const WEIR = [toW([612, 0])[0], toW([724, 0])[0]]
const NECK_X = toW([900, 0])[0]
const PLAIN_X = toW([950, 0])[0]
const TIP = toW([304, 356])

// ================= water levels (world y) =================
// Heights are in metres; drawn at VS world units per metre with 1 horizontal unit ≈ 7 m: ~4x vertical exaggeration.
const VS = 0.55
const LAND = 7.5
const CREST = INNER_BED + 2.1 // weir crest ≈ 2.1 m above the inner riverbed
const WEIR_LEN = 240          // 飞沙堰 ≈ 240 m long
/** head over a broad-crested weir: Q = 1.7·L·H^1.5 (SI)  =>  H = (Q / 1.7L)^(2/3) */
const weirHead = Qw => Math.pow(Qw / (1.7 * WEIR_LEN), 2 / 3)
/** wide channel, Manning: depth ∝ Q^0.6, mean velocity ∝ Q^0.4 */
const depthRatio = (Q, Qref) => Math.pow(Q / Qref, 0.6)
const SW = 0.55 // the weir's position along the inner channel
function levels(t) {
  const sp = split(riverQ(t))
  const atWeir = CREST + weirHead(sp.weir) // the inner river is held up behind the Bottle-Neck
  return { sp, atWeir, mainEnd: atWeir + 0.5,
    outerD: 1.0 * depthRatio(sp.outer, 450), neckD: 1.2 * depthRatio(sp.neck, 420), canalD: 0.5 * depthRatio(sp.neck, 420) }
}
const OUTER_BED = s => -0.6 - 2.2 * s, NECK_BED = s => 0.0 - 0.3 * s, CANAL_BED = s => 0.4 - 0.3 * s
let LV = null
function level(name, s) {
  const v = LV
  switch (name) {
    case 'main': return v.mainEnd + 0.5 * (1 - s)
    case 'inner': return s < SW ? v.atWeir + 0.35 * (SW - s) / SW : v.atWeir - 0.12 * (s - SW) / (1 - SW)
    case 'neck': return Math.min(v.atWeir - 0.12, NECK_BED(s) + v.neckD)
    case 'outer': return v.mainEnd + (OUTER_BED(s) + v.outerD - v.mainEnd) * smooth(Math.min(1, s / 0.3))
    default: return CANAL_BED(s) + v.canalD
  }
}
const speedOf = (name, t) => {
  const sp = split(riverQ(t))
  const r = name === 'main' ? sp.Q / 1000 : name === 'inner' ? sp.inner / 550 : name === 'outer' ? sp.outer / 450 : sp.neck / 420
  return 0.9 * Math.pow(r, 0.4)
}

// ================= terrain =================
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s) }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf)
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1)
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v
}
const fbm = (x, y) => { let s = 0, a = 0.5; for (let i = 0; i < 5; i++) { s += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5 } return s }
function nearest(r, x, z) {
  let best = 1e9, bi = 0
  for (let i = 0; i < r.pts.length; i += 2) { const p = r.pts[i]; const d = (p[0]-x)**2 + (p[1]-z)**2; if (d < best) { best = d; bi = i } }
  for (let i = Math.max(0, bi - 2); i <= Math.min(r.pts.length - 1, bi + 2); i++) { const p = r.pts[i]; const d = (p[0]-x)**2 + (p[1]-z)**2; if (d < best) { best = d; bi = i } }
  return [Math.sqrt(best), bi]
}
const dist2 = (x, z, cx, cz, rx, rz) => Math.hypot((x - cx) / rx, (z - cz) / rz)
function landHeight(x, z) {
  let h = LAND + (fbm(x * 0.05, z * 0.05) - 0.5) * 1.6
  // the plain east of the Bottle-Neck is lower and flat
  if (x > PLAIN_X - 6 && z < 20) h = 2.6 + (fbm(x * 0.08, z * 0.08) - 0.5) * 0.3 + Math.max(0, (PLAIN_X - x)) * 0.8
  // Min mountains on the far (north-west) edge
  const mtnL = Math.max(0, 1 - dist2(x, z, -175, -40, 70, 60)) + Math.max(0, 1 - dist2(x, z, -170, 70, 60, 45))
  h += mtnL * mtnL * 55 * (0.7 + 0.6 * fbm(x * 0.06, z * 0.06))
  // Yulei Hill north of the Bottle-Neck
  const yl = Math.max(0, 1 - dist2(x, z, 64, -42, 40, 30))
  h += yl * yl * 20 * (0.75 + 0.5 * fbm(x * 0.09 + 3, z * 0.09))
  // Lidui rock just south of the cut
  const ld = Math.max(0, 1 - dist2(x, z, 69, -12, 6.5, 7))
  h += ld * 9
  // back hills behind everything
  const back = Math.max(0, (-z - 60) / 40)
  h += back * back * 40 * (0.6 + 0.8 * fbm(x * 0.04, z * 0.04))
  return h
}
const NAMES = Object.keys(RIV)
function terrainAt(x, z) {
  let h = landHeight(x, z)
  let near = null, nd = 1e9
  for (const n of NAMES) {
    const r = RIV[n]
    const [d, i] = nearest(r, x, z)
    const s = i / (r.pts.length - 1)
    // bed slopes gently downstream
    const bed = r.bed - (n === 'outer' ? 2.2 * s : n === 'main' ? -0.4 * (1 - s) : 0.3 * s)
    const edge = r.hw + r.bank
    if (d < edge + 0.01) {
      const prof = d < r.hw ? bed + (d / r.hw) ** 2 * 0.8 : bed + 0.8 + (h - bed - 0.8) * smooth((d - r.hw) / r.bank)
      if (prof < h) h = prof
    }
    if (d - r.hw < nd) { nd = d - r.hw; near = n }
  }
  // the island between the channels (Jingang levee): about 3 m above the weir crest
  if (x > TIP[0] && x < NECK_X - 4) {
    const zin = RIV.inner.pts[nearest(RIV.inner, x, z)[1]][1], zout = RIV.outer.pts[nearest(RIV.outer, x, z)[1]][1]
    if (z > zin && z < zout) h = Math.min(h, CREST + 4.6 + (fbm(x * 0.1, z * 0.1) - 0.5) * 0.4)
  }
  // the Flying Sand Weir: a low section of the levee between the inner and outer channels
  if (x > WEIR[0] && x < WEIR[1]) {
    const [di] = nearest(RIV.inner, x, z), [dout] = nearest(RIV.outer, x, z)
    const zin = RIV.inner.pts[nearest(RIV.inner, x, z)[1]][1]
    if (z > zin && di < 30 && dout < 30) {
      const k = smooth(Math.min(x - WEIR[0], WEIR[1] - x) / 3)
      h = Math.min(h, h + (CREST - h) * k)
    }
  }
  return [h, near, nd]
}

// ================= three.js scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(W, H)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.outputColorSpace = THREE.SRGBColorSpace
document.body.prepend(renderer.domElement)

const scene = new THREE.Scene()
const SKY = new THREE.Color('#0b2230')
scene.background = SKY
scene.fog = new THREE.Fog(SKY, 230, 470)
const camera = new THREE.PerspectiveCamera(30, W / H, 1, 2000)

const hemi = new THREE.HemisphereLight('#bfe6ff', '#1d2a22', 0.95)
scene.add(hemi)
const sun = new THREE.DirectionalLight('#fff1d6', 2.4)
sun.position.set(-120, 160, 90)
sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048)
Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 140, bottom: -140, near: 10, far: 500 })
sun.shadow.bias = -0.0008
scene.add(sun)

// terrain mesh
const TX = [-210, 230], TZ = [-130, 110], NX = 330, NZ = 190
const tg = new THREE.PlaneGeometry(TX[1] - TX[0], TZ[1] - TZ[0], NX, NZ)
tg.rotateX(-Math.PI / 2)
tg.translate((TX[0] + TX[1]) / 2, 0, (TZ[0] + TZ[1]) / 2)
const tp = tg.attributes.position
const tcol = new Float32Array(tp.count * 3)
const cA = new THREE.Color(), cB = new THREE.Color()
const grass1 = new THREE.Color('#355f3a'), grass2 = new THREE.Color('#4c7a3e'), rock = new THREE.Color('#5d6a60'), rockHi = new THREE.Color('#7f8a7f')
const sand = new THREE.Color('#7b7d74'), stone = new THREE.Color('#a7aca2'), field1 = new THREE.Color('#5f8f3f'), field2 = new THREE.Color('#7d9a45'), field3 = new THREE.Color('#47783f')
for (let i = 0; i < tp.count; i++) {
  const x = tp.getX(i), z = tp.getZ(i)
  const [h, near, nd] = terrainAt(x, z)
  tp.setY(i, h)
  const n = fbm(x * 0.15, z * 0.15)
  if (h < CREST + 0.5 && nd < 10 && !(x > PLAIN_X - 2 && z < 18)) cA.copy(sand).lerp(new THREE.Color('#5c5f58'), 0.5 * n)
  else if (h > 13) cA.copy(rock).lerp(rockHi, Math.min(1, (h - 14) / 30 + n * 0.3))
  else if (x > PLAIN_X - 2 && z < 18 && h < 4.5) {
    const cx = Math.floor((x * 0.97 + z * 0.25) / 6), cz = Math.floor((z * 0.97 - x * 0.25) / 5)
    const k = hash(cx, cz)
    cA.copy(k < 0.33 ? field1 : k < 0.66 ? field2 : field3)
    const fx = ((x * 0.97 + z * 0.25) / 6) % 1, fz = ((z * 0.97 - x * 0.25) / 5) % 1
    if (Math.min(Math.abs(fx), Math.abs(fz)) < 0.08 || Math.max(Math.abs(fx), Math.abs(fz)) > 0.92) cA.multiplyScalar(0.7)
  } else cA.copy(grass1).lerp(grass2, n)
  // masonry banks along the channels (Jingang levee), and the stone Fish Mouth
  if (nd > 0 && nd < 3.5 && h > CREST + 0.3 && h < LAND + 1.2 && (near === 'inner' || near === 'outer' || near === 'main' || near === 'neck')) cA.lerp(stone, 0.4)
  if (Math.hypot(x - TIP[0], z - TIP[1]) < 7) cA.copy(stone)
  if (x > WEIR[0] - 1 && x < WEIR[1] + 1 && Math.abs(h - CREST) < 0.35) cA.copy(new THREE.Color('#7f8a86'))
  tcol[i * 3] = cA.r; tcol[i * 3 + 1] = cA.g; tcol[i * 3 + 2] = cA.b
}
tg.setAttribute('color', new THREE.BufferAttribute(tcol, 3))
tg.computeVertexNormals()
const terrain = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }))
terrain.castShadow = terrain.receiveShadow = true
terrain.scale.y = VS
scene.add(terrain)

// small trees on dry land for scale
{
  const geo = new THREE.ConeGeometry(1.1, 3.4, 6)
  const mat = new THREE.MeshStandardMaterial({ color: '#2c5232', roughness: 1 })
  const trees = new THREE.InstancedMesh(geo, mat, 900)
  const m = new THREE.Matrix4(); let k = 0
  for (let i = 0; i < 6000 && k < 900; i++) {
    const x = TX[0] + hash(i, 1) * (TX[1] - TX[0]), z = TZ[0] + hash(i, 2) * (TZ[1] - TZ[0])
    const [h, , nd] = terrainAt(x, z)
    if (nd < 9 || h < 5.5 || h > 26 || (x > PLAIN_X - 4 && z < 18)) continue
    if (fbm(x * 0.07, z * 0.07) < 0.47) continue
    const s = 0.7 + hash(i, 3) * 0.7
    m.compose(new THREE.Vector3(x, h * VS + 1.5 * s, z), new THREE.Quaternion(), new THREE.Vector3(s, s, s))
    trees.setMatrixAt(k++, m)
  }
  trees.count = k
  trees.castShadow = true
  scene.add(trees)
}

// ================= water =================
const waterVS = `
attribute vec2 flow; // x: metres along the river, y: -1..1 across
varying vec2 vFlow; varying vec3 vW;
void main(){ vFlow = flow; vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`
const waterFS = `
uniform float uTime, uSpeed, uMud, uFoam, uAlpha; uniform vec3 uSun; uniform vec3 uFogColor; uniform float uFogNear, uFogFar;
varying vec2 vFlow; varying vec3 vW;
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.02+vec2(1.7,9.2); a*=.5; } return s; }
float field(vec2 q){ return fbm(q) ; }
void main(){
  float t = uTime * uSpeed;
  vec2 q = vec2(vFlow.x*0.22 - t*0.9, vFlow.y*1.6);

  // the grey-call ladder
  if (t > 7.6 && t < 10.6) {
    const a = Math.min(1, (t - 7.6) / 0.3, (10.6 - t) / 0.3)
    const [lx, ly] = proj(...(() => { const p = toW([470, 200]); return [p[0], 12, p[1]] })())
    const lit = i => (i === 0 && t > 7.9) || (i === 1 && t > 8.4)
    const ok = t > 9.3
    extra += `<div class="panel" style="left:${lx - 150}px;top:${ly - 120}px;border-color:${COL.amber};opacity:${a}">
      <div style="color:${COL.amber};font-weight:700;font-size:15px">${S.ladderT}</div>
      <div class="steps">${S.ladder.map((s, i) => `<span style="${lit(i) ? `border-color:${i === 1 ? COL.amber : COL.green};background:${i === 1 ? '#2a2210' : '#10261c'}` : ''}">${s}</span>`).join('<i>›</i>')}</div>
      <div style="margin-top:8px;font-size:13px;color:${ok ? COL.green : '#a9c4d1'};font-weight:${ok ? 700 : 400}">${ok ? S.ladderOk : S.ladderNote}</div></div>`
  }
  if (t > 9.4 && t < 12.1) {
    const a = Math.min(1, (t - 9.4) / 0.3, (12.1 - t) / 0.3)
    const [dx, dy] = proj(...(() => { const p = toW([700, 470]); return [p[0], 6, p[1]] })())
    extra += `<div class="panel" style="left:${dx - 40}px;top:${dy}px;border-color:${COL.red};opacity:${a};background:#1c0d10f0">
      <div style="color:${COL.red};font-weight:700;font-size:15px">${S.deny1}</div><div style="font-size:13px;color:#f0c9c9;margin-top:4px">${S.deny2}</div></div>`
  }
  // Bottle-Neck meter
  {
    const [mx, my] = proj(...(() => { const p = toW([950, 330]); return [p[0], 6, p[1]] })())
    const st = t >= 11.1 && t < 12.7 ? 1 : t >= 12.7 && t < 14.1 ? 2 : 0
    const on = st === 1 ? 2 : st === 2 ? 3 : 4
    const col = st === 1 ? COL.amber : st === 2 ? COL.green : '#e8f1f6'
    extra += `<div class="meter" style="right:${W - mx - 60}px;top:${my}px"><span style="color:#a9c4d1;font-weight:700">${S.meter}</span>${[0, 1, 2, 3].map(i => `<span class="slot" style="opacity:${i < on ? 1 : .15}"></span>`).join('')}<span class="mono" style="color:${col};font-size:13px">${S.mStates[st]}</span></div>`
  }
  document.getElementById('chips').innerHTML = chips.join('') + extra
}

// ================= camera + frame =================
function setCamera(t) {
  const a = Math.sin(t / T * Math.PI * 2)
  camera.position.set(-2 + 8 * a, 175, 190)
  camera.lookAt(6 + 3 * a, -4, -10)
}
window.renderAt = t => {
  t = ((t % T) + T) % T
  LV = levels(t)
  setCamera(t)
  updateWater(t); updateSpill(t); updateSand(t)
  renderer.render(scene, camera)
  overlay(t)
}
window.T = T
window.ready = true
if (!q.has('capture')) {
  const t0 = performance.now()
  const loop = () => { window.renderAt((performance.now() - t0) / 1000 + (+q.get('t') || 0)); requestAnimationFrame(loop) }
  loop()
} else window.renderAt(+q.get('t') || 0)
</script></body></html>
